[versions]
agp = "8.10.1"
cardview = "1.0.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
junitJupiter = "5.12.2"
rules = "1.6.1"
runner = "1.6.2"

[libraries]
