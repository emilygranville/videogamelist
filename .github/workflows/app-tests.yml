# This is a basic workflow to help you get started with Actions

name: app tests

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "app-main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "unit_test"
  unit_test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4

      # Sets up the Java to run on the action
      - name: Sets up Java
        uses: actions/setup-java@v2
        with:
            java-version: 17
            distribution: "temurin"

      # Sets up the google-services.json file
      - name: Create file
        run: cat /home/runner/work/VideoGameList/VideoGameList/app/google-services.json | base64

      - name: Putting data
        env:
            DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $DATA > /home/runner/work/VideoGameList/VideoGameList/app/google-services.json

      # Runs the gradle tests
      - name: Run gradle tests
        run: |
            cd app
            gradle test
            echo ===Tests Finished===